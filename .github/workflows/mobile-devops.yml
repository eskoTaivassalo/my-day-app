name: Mobile DevOps

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Expo doctor
        run: npm run doctor

      - name: Validate Android bundle
        run: npm run bundle:android

      - name: Validate iOS bundle
        run: npm run bundle:ios